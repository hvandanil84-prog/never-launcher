      - name: Build APK
        working-directory: NeverLauncher
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" NeverLauncher/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" --title "Never Launcher build ${{ github.run_number }}" --notes "Debug APK"
